<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | Patrick Borges</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="preload" href="/fonts/big-shoulders-display.woff" as="font" type="font/woff" crossorigin>
<style>
@font-face { font-family: 'Big Shoulders Display'; font-weight: 700 900; font-display: swap; src: url(/fonts/big-shoulders-display.woff) format('woff') }
@font-face { font-family: 'Public Sans'; font-weight: 400 700; font-display: swap; src: url(/fonts/public-sans.woff) format('woff') }
@font-face { font-family: 'Overpass Mono'; font-weight: 400 600; font-display: swap; src: url(/fonts/overpass-mono.woff) format('woff') }
:root { --bg: #ECEFF2; --ink: #0B1722; --ink-2: #45586A; --link: #0A4FD6; --tape: #FFC21A; --tape-ink: #0B1722 }
@media (prefers-color-scheme: dark) { :root { --bg: #07111A; --ink: #E7EDF2; --ink-2: #9BAFC0; --link: #7DB2FF; color-scheme: dark } }
* { box-sizing: border-box; margin: 0 }
body { min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--ink); font: 400 1rem/1.6 'Public Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif }
main { width: min(560px, 100%) }
.tape { display: inline-block; padding: 5px 11px; background: var(--tape); color: var(--tape-ink); font: 600 .75rem/1.25 'Overpass Mono', ui-monospace, Menlo, Consolas, monospace; letter-spacing: .09em; text-transform: uppercase }
h1 { margin: 18px 0 10px; text-transform: uppercase; font: 800 clamp(4.5rem, 20vw, 9rem)/.9 'Big Shoulders Display', 'Arial Narrow', Impact, sans-serif; letter-spacing: .01em }
p { color: var(--ink-2); max-width: 44ch }
.go { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px }
.btn { display: inline-flex; align-items: center; min-height: 46px; padding: 0 20px; border-radius: 2px; background: var(--tape); color: var(--tape-ink); font: 600 .875rem/1 'Overpass Mono', ui-monospace, Menlo, Consolas, monospace; letter-spacing: .08em; text-transform: uppercase; text-decoration: none }
.btn.line { background: transparent; color: var(--ink); border: 1px solid currentColor }
a:focus-visible { outline: 2px solid var(--link); outline-offset: 3px }
</style>
</head>
<body>
<main>
  <span class="tape">Error 404</span>
  <h1>Not found</h1>
  <p>That page doesn't exist. The whole portfolio lives on one page, so the links below will get you where you were going.</p>
  <div class="go">
    <a class="btn" href="/">Go to patrickborges.dev</a>
    <a class="btn line" href="/Patrick_Borges_Resume.pdf" download>Download résumé</a>
  </div>
</main>
</body>
</html>
